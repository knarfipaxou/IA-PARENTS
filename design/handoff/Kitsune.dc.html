<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
@keyframes kNod{0%{transform:rotate(0) translateY(0)}22%{transform:rotate(1.5deg) translateY(2.5%)}46%{transform:rotate(-1deg) translateY(-1%)}70%{transform:rotate(1.2deg) translateY(2%)}100%{transform:rotate(0) translateY(0)}}
@keyframes kNodSmall{0%,100%{transform:translateY(0)}40%{transform:translateY(1.8%)}}
@keyframes kTilt{0%{transform:rotate(0)}30%{transform:rotate(-7deg)}62%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes kTiltSmall{0%,100%{transform:rotate(0)}45%{transform:rotate(3.5deg)}}
@keyframes kPerk{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-2deg) scale(1.04)}60%{transform:rotate(2deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
@keyframes kWag{0%{transform:rotate(0)}18%{transform:rotate(-13deg)}38%{transform:rotate(9deg)}58%{transform:rotate(-8deg)}78%{transform:rotate(5deg)}100%{transform:rotate(0)}}
@keyframes kWagSlow{0%,100%{transform:rotate(0)}35%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}}
@keyframes kIdleWag{0%,100%{transform:rotate(0)}25%{transform:rotate(-3.5deg)}62%{transform:rotate(2.5deg)}}
@keyframes kPawLift{0%{transform:rotate(0) translateY(0)}30%{transform:rotate(-16deg) translateY(-7%)}55%{transform:rotate(-13deg) translateY(-5%)}80%{transform:rotate(-4deg) translateY(-1%)}100%{transform:rotate(0) translateY(0)}}
@keyframes kPawTap{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) translateY(-4%)}40%{transform:rotate(0)}60%{transform:rotate(-8deg) translateY(-3%)}80%{transform:rotate(0)}}
@keyframes kBlink{0%,26%,44%,70%,100%{transform:scaleY(0)}33%,60%{transform:scaleY(1)}}
@keyframes kIdleBlink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes kWink{0%,30%,60%,100%{transform:scaleY(0)}40%,52%{transform:scaleY(1)}}
@keyframes kHop{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.08,.92)}42%{transform:translateY(-9%) scale(.95,1.06)}70%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1,1)}}
@keyframes kBounce{0%,100%{transform:scale(1,1)}30%{transform:scale(1.05,.95)}60%{transform:scale(.98,1.02)}}
@keyframes kBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.018)}}
@keyframes kShadow{0%,100%{transform:scaleX(1);opacity:.42}42%{transform:scaleX(.82);opacity:.24}}
</style></helmet>
<div style="position:relative;width:100%;aspect-ratio:700/850">{{ rig }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:316},&quot;move&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;nod&quot;,&quot;tilt&quot;,&quot;wag&quot;,&quot;paw&quot;,&quot;blink&quot;,&quot;hop&quot;,&quot;tap&quot;,&quot;work&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tick&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
const POSES = {
  nod:   { head: 'kNod .8s cubic-bezier(.34,1.4,.64,1)', tail: 'kWagSlow 1.1s ease-in-out', eyes: 'kBlink 1s ease-in-out' },
  tilt:  { head: 'kTilt .9s cubic-bezier(.34,1.4,.64,1)', tail: 'kIdleWag 1.2s ease-in-out', eyes: 'kWink .9s ease-in-out', wink: true },
  wag:   { tail: 'kWag 1s cubic-bezier(.4,0,.3,1)', body: 'kBounce .7s ease-out', head: 'kNodSmall .7s ease-in-out' },
  paw:   { paw: 'kPawLift 1s cubic-bezier(.34,1.4,.64,1)', head: 'kTiltSmall 1s ease-in-out', tail: 'kWagSlow 1s ease-in-out' },
  blink: { eyes: 'kBlink 1.1s ease-in-out', head: 'kPerk .8s cubic-bezier(.34,1.5,.64,1)', tail: 'kIdleWag 1.1s ease-in-out' },
  hop:   { body: 'kHop .8s cubic-bezier(.3,1.3,.5,1)', tail: 'kWag .9s ease-out', head: 'kNodSmall .8s ease-out', shadow: 'kShadow .8s ease-out' },
  tap:   { paw: 'kPawTap 1s ease-in-out', head: 'kNod .9s ease-in-out', tail: 'kIdleWag 1.1s ease-in-out' },
  work:  { paw: 'kPawTap 1.4s ease-in-out infinite', head: 'kNodSmall 2.2s ease-in-out infinite', tail: 'kIdleWag 2.8s ease-in-out infinite', eyes: 'kIdleBlink 4.5s ease-in-out infinite' },
};
const IDLE = { tail: 'kIdleWag 4.2s ease-in-out infinite', body: 'kBreathe 4.6s ease-in-out infinite', eyes: 'kIdleBlink 6s ease-in-out infinite' };

class Component extends DCLogic {
  layer(src, style) {
    return React.createElement('img', {
      src, alt: '', draggable: false,
      style: { position: 'absolute', display: 'block', width: '100%', height: '100%', objectFit: 'contain', ...style },
    });
  }

  renderVals() {
    const move = this.props.move;
    const p = POSES[move] || {};
    const on = !!POSES[move];
    const a = (k) => (on ? p[k] : IDLE[k]) || 'none';

    const lid = (side) => React.createElement('div', {
      style: {
        position: 'absolute',
        left: side === 'l' ? '20.7%' : '53.2%',
        top: side === 'l' ? '61.6%' : '63.6%',
        width: side === 'l' ? '15.1%' : '14.3%',
        height: '16%',
        borderRadius: '46% 46% 50% 50%',
        background: '#E8894F',
        transformOrigin: '50% 0%',
        transform: 'scaleY(0)',
        animation: p.wink && side === 'r' ? 'none' : a('eyes'),
      },
    });

    return {
      rig: React.createElement('div', {
        key: this.props.tick,
        style: { position: 'absolute', inset: 0, transformOrigin: '50% 96%', animation: a('body') },
      }, [
        React.createElement('div', {
          key: 'sh',
          style: {
            position: 'absolute', left: '14%', bottom: '-1.5%', width: '66%', height: '5.5%',
            borderRadius: '50%', background: 'rgba(0,0,0,.5)', filter: 'blur(7px)', opacity: .42,
            transformOrigin: '50% 50%', animation: p.shadow || 'none',
          },
        }),
        React.createElement('div', {
          key: 'tail',
          style: { position: 'absolute', left: '64.29%', top: '43.53%', width: '35.71%', height: '54.71%', transformOrigin: '20% 90%', animation: a('tail') },
        }, this.layer('assets/kitsune-tail.png')),
        this.layer('assets/kitsune-body.png', { key: 'body', inset: 0 }),
        React.createElement('div', {
          key: 'paw',
          style: { position: 'absolute', left: '12.14%', top: '78.59%', width: '24%', height: '21.41%', transformOrigin: '50% 18%', animation: a('paw') },
        }, this.layer('assets/kitsune-paw.png')),
        React.createElement('div', {
          key: 'head',
          style: { position: 'absolute', left: '2.14%', top: 0, width: '75.71%', height: '58.82%', transformOrigin: '50% 94%', animation: a('head') },
        }, [
          this.layer('assets/kitsune-head.png', { key: 'h' }),
          React.createElement('div', { key: 'll' }, lid('l')),
          React.createElement('div', { key: 'lr' }, lid('r')),
        ]),
      ]),
    };
  }
}
</script>
</body>
</html>
