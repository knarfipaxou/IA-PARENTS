<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROF PARENT IA — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #E8EAE6;
    background-image: radial-gradient(circle at 30% 0%, #EEF0EC, #E2E5E0 70%);
    min-height: 100vh;
  }
  #stage {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
  @keyframes ppIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ppScan { 0% { top: 6%; } 50% { top: 92%; } 100% { top: 6%; } }
  @keyframes ppToast { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="art.jsx"></script>
<script type="text/babel" src="screens1.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="screens3.jsx"></script>
<script type="text/babel" src="screens4.jsx"></script>
<script type="text/babel" src="screens5.jsx"></script>
<script type="text/babel" src="screens6.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "brand": "emeraude",
  "dark": false,
  "textScale": 105,
  "screen": "correction"
}/*EDITMODE-END*/;

const SCREENS = ['welcome', 'family', 'profile', 'home', 'children', 'progress', 'scanAgenda', 'agendaResults', 'scan', 'result', 'validation', 'photoFloue', 'plan', 'exercices', 'correction', 'mockTest', 'notifications', 'settings', 'pdf', 'coming'];
const SCREEN_LABELS = {
  welcome: '1 · Accueil', family: '2 · Création famille', profile: '3 · Profil enfant',
  home: '4 · Tableau de bord', children: '5 · Liste enfants', progress: '15 · Suivi & progression',
  scanAgenda: '6 · Scanner l\u2019agenda', agendaResults: '7 · Résultats agenda',
  scan: '8 · Scanner une leçon', result: '9 · Résultat leçon', validation: '10 · Validation parent',
  photoFloue: '18 · Photo floue', plan: '11 · Plan de révision', exercices: '12 · Exercices du jour',
  correction: '13 · Correction parent', mockTest: '14 · Contrôle blanc',
  notifications: '16 · Notifications', settings: '17 · Paramètres', pdf: '19 · PDF', coming: '20 · À venir',
};

// Entrance via post-mount transition (capture-safe: settled state is opacity:1 inline)
function Enter({ children, label }) {
  const [on, setOn] = React.useState(false);
  React.useEffect(() => { const r = requestAnimationFrame(() => setOn(true)); return () => cancelAnimationFrame(r); }, []);
  return (
    <div data-screen-label={label} style={{
      height: '100%', opacity: on ? 1 : 0, transform: on ? 'none' : 'translateY(10px)',
      transition: 'opacity .35s cubic-bezier(.32,.72,0,1), transform .35s cubic-bezier(.32,.72,0,1)',
    }}>{children}</div>
  );
}

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = React.useMemo(() => makeTheme(tw.brand, tw.dark), [tw.brand, tw.dark]);

  const [screen, setScreen] = React.useState('welcome');
  const [profile, setProfile] = React.useState({ prenom: '', classe: 'CM2', goal: 'comprendre', familyName: '' });
  const [toastMsg, setToastMsg] = React.useState(null);
  const toastTimer = React.useRef(null);

  const go = React.useCallback((name) => {
    setScreen(name);
    setTweak('screen', name);
  }, [setTweak]);

  // let the Tweaks "Écran" select drive navigation
  React.useEffect(() => { if (tw.screen && tw.screen !== screen) setScreen(tw.screen); /* eslint-disable-next-line */ }, [tw.screen]);

  const toast = React.useCallback((msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2200);
  }, []);

  const screenEl = {
    welcome: <WelcomeScreen go={go} />,
    family:  <FamilyScreen go={go} state={profile} setState={setProfile} />,
    profile: <ProfileScreen go={go} state={profile} setState={setProfile} />,
    home:    <HomeScreen go={go} state={profile} toast={toast} />,
    children:<ChildrenScreen go={go} />,
    progress:<ProgressScreen go={go} />,
    scanAgenda:   <ScanAgendaScreen go={go} toast={toast} />,
    agendaResults:<AgendaResultsScreen go={go} toast={toast} />,
    scan:    <ScanScreen go={go} toast={toast} />,
    result:  <ResultScreen go={go} toast={toast} />,
    validation: <ValidationScreen go={go} toast={toast} />,
    photoFloue: <PhotoFloueScreen go={go} toast={toast} />,
    plan:    <PlanScreen go={go} toast={toast} />,
    exercices: <ExercisesScreen go={go} toast={toast} />,
    correction: <CorrectionScreen go={go} toast={toast} />,
    mockTest: <MockTestScreen go={go} toast={toast} />,
    notifications: <NotificationsScreen go={go} toast={toast} />,
    settings: <SettingsScreen go={go} toast={toast} dark={tw.dark} onToggleDark={() => setTweak('dark', !tw.dark)} />,
    pdf:     <PdfScreen go={go} toast={toast} />,
    coming:  <ComingSoonScreen go={go} />,
  }[screen];

  return (
    <ThemeCtx.Provider value={theme}>
      <div style={{ fontSize: `${tw.textScale}%` }}>
        <IOSDevice dark={tw.dark}>
          <div style={{
            height: '100%', position: 'relative', background: theme.bg,
            fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif",
            color: theme.ink, WebkitFontSmoothing: 'antialiased',
          }}>
            <Enter key={screen} label={SCREEN_LABELS[screen]}>
              {screenEl}
            </Enter>

            {/* toast */}
            {toastMsg && (
              <div style={{
                position: 'absolute', bottom: 96, left: '50%', zIndex: 80,
                background: theme.dark ? '#F2F6F3' : '#13241D', color: theme.dark ? '#13241D' : '#fff',
                borderRadius: 14, padding: '12px 18px', fontSize: 14, fontWeight: 700, letterSpacing: -0.2,
                boxShadow: '0 10px 30px rgba(0,0,0,0.25)', animation: 'ppToast .25s ease',
                display: 'flex', alignItems: 'center', gap: 9, maxWidth: '82%',
              }}>
                <IconSparkle size={16} style={{ color: theme.primary, flexShrink: 0 }} /> {toastMsg}
              </div>
            )}
          </div>
        </IOSDevice>
      </div>

      <TweaksPanel>
        <TweakSection label="Ambiance" />
        <TweakColor label="Couleur de marque" value={theme.primary}
          options={[BRANDS.emeraude.primary, BRANDS.cobalt.primary, BRANDS.prune.primary]}
          onChange={(v) => {
            const key = Object.keys(BRANDS).find(k => BRANDS[k].primary === v) || 'emeraude';
            setTweak('brand', key);
          }} />
        <TweakToggle label="Mode sombre" value={tw.dark} onChange={(v) => setTweak('dark', v)} />
        <TweakSection label="Lisibilité" />
        <TweakSlider label="Taille du texte" value={tw.textScale} min={90} max={120} step={5} unit="%"
          onChange={(v) => setTweak('textScale', v)} />
        <TweakSection label="Navigation" />
        <TweakSelect label="Écran" value={screen}
          options={SCREENS.map(s => ({ value: s, label: SCREEN_LABELS[s] }))}
          onChange={(v) => go(v)} />
      </TweaksPanel>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('stage')).render(<App />);
</script>
</body>
</html>
