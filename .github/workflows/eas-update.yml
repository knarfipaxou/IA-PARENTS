name: Publier sur Expo (EAS Update)

on:
  workflow_dispatch:
  push:
    branches: [claude/lucid-lamport-AeSNN]
    paths-ignore:
      - '**.md'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Configurer le projet EAS
        env:
          RAW_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export EXPO_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          WHOAMI="$(npx eas-cli whoami 2>/dev/null)"
          echo "--- Comptes visibles par le token ---"
          echo "$WHOAMI"
          echo "-------------------------------------"
          ACCOUNT="$(echo "$WHOAMI" | grep -i 'Role: *Owner' | head -1 | sed 's/(Role.*//' | tr -d '•[:space:]')"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$(echo "$WHOAMI" | head -1 | tr -d '•[:space:]')"; fi
          echo "Compte Expo retenu : $ACCOUNT"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.owner=process.argv[1];fs.writeFileSync('app.json',JSON.stringify(j,null,2))" "$ACCOUNT"
          npx eas-cli init --non-interactive --force
          npx eas-cli update:configure --non-interactive || true

      - name: Publier la mise à jour
        env:
          RAW_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export EXPO_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          npx eas-cli update --branch preview --message "Publication automatique" --non-interactive

      - name: Afficher le lien de test
        env:
          RAW_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export EXPO_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "===== LIEN POUR EXPO GO ====="
          npx eas-cli project:info --non-interactive || true
          grep -A2 projectId app.json || true
